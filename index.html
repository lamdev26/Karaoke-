<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Realtime Audio & SRT Sync</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --active-color: #3fb950;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .upload-card {
            background: var(--card-bg);
            border: 1px dashed #30363d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-input-group label {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        input[type="file"] {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .visualizer-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100px;
            background: #000;
            border-radius: 8px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }

        .lyrics-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #30363d;
            height: 280px;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            scroll-behavior: smooth;
        }

        .lyric-line {
            font-size: 1rem;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 6px;
            color: var(--text-muted);
            transition: all 0.2s ease;
            text-align: center;
        }

        .lyric-line.active {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.15rem;
            background-color: rgba(88, 166, 255, 0.15);
            border-left: 4px solid var(--accent-color);
            transform: scale(1.02);
        }

        .metrics-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid #30363d;
        }

        .metric-item {
            text-align: center;
        }

        .metric-value {
            font-weight: bold;
            color: var(--active-color);
        }

        /* Tối ưu thanh cuộn */
        .lyrics-card::-webkit-scrollbar {
            width: 6px;
        }
        .lyrics-card::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 Music Analyzer & SRT Sync</h1>
        <p>Phân tích phổ âm thanh & Đồng bộ phụ đề thời gian thực</p>
    </header>

    <!-- Khu vực tải file -->
    <div class="upload-card">
        <div class="file-input-group">
            <label for="audioFile">1. Chọn tệp Âm thanh (.mp3, .wav, .m4a):</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>
        <div class="file-input-group">
            <label for="srtFile">2. Chọn tệp Phụ đề (.srt) [Tùy chọn]:</label>
            <input type="file" id="srtFile" accept=".srt">
        </div>
    </div>

    <!-- Trực quan hóa phổ âm thanh -->
    <div class="visualizer-card">
        <canvas id="visualizerCanvas"></canvas>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Thông số kĩ thuật thời gian thực -->
    <div class="metrics-bar">
        <div class="metric-item">Thì gian: <span id="timeDisplay" class="metric-value">00:00</span></div>
        <div class="metric-item">Trạng thái: <span id="statusDisplay" class="metric-value">Sẵn sàng</span></div>
        <div class="metric-item">Số dòng sub: <span id="subCountDisplay" class="metric-value">0</span></div>
    </div>

    <!-- Khung hiển thị lời cuộn Realtime -->
    <div class="lyrics-card" id="lyricsContainer">
        <div class="lyric-line" style="margin-top: 80px;">Tải nhạc và tệp .srt để bắt đầu đồng bộ...</div>
    </div>
</div>

<script>
    // Các phần tử DOM
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFile');
    const srtFileInput = document.getElementById('srtFile');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const canvas = document.getElementById('visualizerCanvas');
    const canvasCtx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const subCountDisplay = document.getElementById('subCountDisplay');

    let parsedSubtitles = [];
    let audioCtx, analyser, source, dataArray;
    let isAudioCtxInit = false;

    // Dữ liệu mẫu SRT tự động nếu người dùng chưa chọn file sub
    const sampleSRT = `1
00:00:01,000 --> 00:00:04,000
Chào mừng bạn đến với AI Music Studio

2
00:00:04,500 --> 00:00:08,000
Hệ thống sẵn sàng phân tích phổ âm thanh Canvas API

3
00:00:08,500 --> 00:00:12,000
Hãy chọn file nhạc MP3 và file SRT từ máy của bạn!`;

    // 1. Khởi tạo dữ liệu ban đầu
    window.addEventListener('DOMContentLoaded', () => {
        parseAndRenderSRT(sampleSRT);
        resizeCanvas();
    });

    window.addEventListener('resize', resizeCanvas);

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }

    // 2. Xử lý tải Audio
    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            audioPlayer.src = url;
            statusDisplay.innerText = "Đã tải audio";
        }
    });

    // 3. Xử lý tải file .SRT
    srtFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                parseAndRenderSRT(event.target.result);
                statusDisplay.innerText = "Đã tải SRT";
            };
            reader.readAsText(file);
        }
    });

    // 4. Giải mã File .SRT sang mảng Object JavaScript
    function parseSRT(data) {
        const regex = /(\d+)\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\n([\s\S]*?)(?=\n\n|\n*$)/g;
        const result = [];
        let match;

        while ((match = regex.exec(data.replace(/\r/g, ''))) !== null) {
            result.push({
                id: match[1],
                start: timeToSeconds(match[2]),
                end: timeToSeconds(match[3]),
                text: match[4].trim()
            });
        }
        return result;
    }

    function timeToSeconds(timeStr) {
        const parts = timeStr.split(/[:,]/);
        return parseInt(parts[0]) * 3600 +
               parseInt(parts[1]) * 60 +
               parseInt(parts[2]) +
               parseInt(parts[3]) / 1000;
    }

    function parseAndRenderSRT(srtText) {
        parsedSubtitles = parseSRT(srtText);
        subCountDisplay.innerText = parsedSubtitles.length;
        lyricsContainer.innerHTML = '';

        if (parsedSubtitles.length === 0) {
            lyricsContainer.innerHTML = '<div class="lyric-line">File SRT không đúng định dạng.</div>';
            return;
        }

        parsedSubtitles.forEach((sub, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `sub-${index}`;
            div.innerText = sub.text;
            lyricsContainer.appendChild(div);
        });
    }

    // 5. Cập nhật đồng bộ lời Realtime khi Audio chạy
    audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        timeDisplay.innerText = formatTime(currentTime);

        let activeIndex = -1;
        for (let i = 0; i < parsedSubtitles.length; i++) {
            if (currentTime >= parsedSubtitles[i].start && currentTime <= parsedSubtitles[i].end) {
                activeIndex = i;
                break;
            }
        }

        // Cập nhật Highlight và Cuộn mượt
        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
            if (idx === activeIndex) {
                if (!el.classList.contains('active')) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                el.classList.remove('active');
            }
        });
    });

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 6. Xử lý Trực quan hóa phổ âm thanh (Web Audio API Canvas)
    audioPlayer.addEventListener('play', () => {
        if (!isAudioCtxInit) {
            initAudioContext();
            isAudioCtxInit = true;
        }
        drawVisualizer();
    });

    function initAudioContext() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64; // Độ phân giải dải tần
        
        source = audioCtx.createMediaElementSource(audioPlayer);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    function drawVisualizer() {
        if (!analyser || audioPlayer.paused) return;

        requestAnimationFrame(drawVisualizer);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#0d1117';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / dataArray.length) * 1.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
            barHeight = (dataArray[i] / 255) * canvas.height;

            // Màu Gradient chuyển từ Xanh Lam sang Xanh Lá
            const green = Math.min(255, barHeight + 100);
            canvasCtx.fillStyle = `rgb(88, ${green}, 255)`;

            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
            x += barWidth + 1;
        }
    }
</script>

</body>
</html>
