<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Audio Studio - Realtime SRT Editor</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --active-color: #3fb950;
            --warning-color: #d29922;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            padding: 6px 0;
        }

        header h1 {
            font-size: 1.3rem;
            color: #fff;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-input-group label {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        input[type="file"], textarea {
            font-size: 0.85rem;
            color: var(--text-main);
            background: #21262d;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #30363d;
            width: 100%;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .btn {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:disabled {
            background: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #1f6beb;
        }

        canvas {
            width: 100%;
            height: 80px;
            background: #000;
            border-radius: 8px;
        }

        audio {
            width: 100%;
            margin-top: 6px;
        }

        .lyrics-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #30363d;
            height: 260px;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lyric-item {
            display: flex;
            flex-direction: column;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            transition: 0.2s ease;
        }

        .lyric-item.active {
            border-color: var(--accent-color);
            background: rgba(88, 166, 255, 0.15);
        }

        .lyric-time {
            font-size: 0.7rem;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .lyric-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .action-row .btn {
            flex: 1;
        }

        .status-box {
            font-size: 0.8rem;
            color: var(--warning-color);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 AI Audio & SRT Sync Studio</h1>
        <p>Phân tích mốc thời gian & Khớp lời bài hát tự động</p>
    </header>

    <!-- 1. Tải Audio & Tạo mốc -->
    <div class="card">
        <div class="file-input-group">
            <label for="audioFile">1. Chọn file Âm thanh (.wav, .mp3, .m4a):</label>
            <input type="file" id="audioFile" accept="audio/*, .mp3, .wav, .m4a">
        </div>

        <button id="btnGenTime" class="btn btn-secondary" disabled>⚡ 1. Tạo mốc thời gian từ tiếng hát</button>
        <div class="status-box" id="statusDisplay">Chọn file nhạc để bắt đầu...</div>
    </div>

    <!-- 2. Dán lời bài hát -->
    <div class="card">
        <div class="file-input-group">
            <label for="rawLyrics">2. Dán lời bài hát vào đây (Mỗi câu 1 dòng):</label>
            <textarea id="rawLyrics" placeholder="Dán bài hát tiếng Việt vào đây...
Ví dụ:
Thương em con nước vơi đầy
Mấy sông cũng lội mấy đèo cũng qua"></textarea>
        </div>
        <button id="btnApplyLyrics" class="btn" disabled>📝 2. Khớp lời vào mốc .SRT</button>
    </div>

    <!-- 3. Trình phát & Trực quan hóa -->
    <div class="card">
        <canvas id="visualizerCanvas"></canvas>
        <audio id="audioPlayer" controls webkit-playsinline playsinline></audio>
    </div>

    <!-- 4. Danh sách dòng lời & Xuất SRT -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; font-weight: 600; color: var(--accent-color);">Lời bài hát (Bấm vào chữ để sửa)</span>
            <button id="btnDownloadSrt" class="btn" style="padding: 4px 10px; font-size: 0.75rem;" disabled>📥 Tải file .SRT</button>
        </div>
        <div class="lyrics-card" id="lyricsContainer">
            <div style="text-align: center; color: var(--text-muted); padding-top: 80px; font-size: 0.85rem;">
                Các dòng phụ đề sẽ xuất hiện tại đây...
            </div>
        </div>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFile');
    const btnGenTime = document.getElementById('btnGenTime');
    const btnApplyLyrics = document.getElementById('btnApplyLyrics');
    const btnDownloadSrt = document.getElementById('btnDownloadSrt');
    const rawLyricsInput = document.getElementById('rawLyrics');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const statusDisplay = document.getElementById('statusDisplay');
    const canvas = document.getElementById('visualizerCanvas');
    const canvasCtx = canvas.getContext('2d');

    let parsedSubtitles = [];
    let currentAudioFile = null;
    let audioCtx, analyser, source, dataArray;
    let isAudioCtxInit = false;

    // 1. Chọn file Audio
    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            currentAudioFile = file;
            audioPlayer.src = URL.createObjectURL(file);
            btnGenTime.disabled = false;
            statusDisplay.innerText = `Đã chọn: ${file.name}`;
            resizeCanvas();
        }
    });

    // 2. Tạo mốc thời gian tự động (VAD)
    btnGenTime.addEventListener('click', async () => {
        if (!currentAudioFile) return;
        statusDisplay.innerText = "⏳ Đang phân tích âm phổ & tạo mốc thời gian...";
        btnGenTime.disabled = true;

        try {
            const arrayBuffer = await currentAudioFile.arrayBuffer();
            const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);

            parsedSubtitles = generateTimestamps(audioBuffer);
            renderSubtitles();

            statusDisplay.innerText = `✅ Đã tạo ${parsedSubtitles.length} mốc thời gian! Hãy dán lời bài hát bước 2.`;
            btnApplyLyrics.disabled = false;
            btnDownloadSrt.disabled = false;
        } catch (err) {
            console.error(err);
            statusDisplay.innerText = "❌ Lỗi đọc âm thanh. Thử file WAV/MP3 khác.";
        } finally {
            btnGenTime.disabled = false;
        }
    });

    // Thuật toán VAD tách mốc thời gian
    function generateTimestamps(audioBuffer) {
        const pcmData = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        const chunkSize = Math.floor(sampleRate * 0.1); // 100ms
        const totalChunks = Math.floor(pcmData.length / chunkSize);
        
        let segments = [];
        let isSpeech = false;
        let speechStart = 0;
        const energyThreshold = 0.02;

        for (let i = 0; i < totalChunks; i++) {
            let sum = 0;
            for (let j = 0; j < chunkSize; j++) {
                sum += Math.abs(pcmData[i * chunkSize + j]);
            }
            let rms = sum / chunkSize;
            let time = (i * chunkSize) / sampleRate;

            if (rms > energyThreshold && !isSpeech) {
                isSpeech = true;
                speechStart = time;
            } else if (rms <= energyThreshold && isSpeech) {
                if (time - speechStart > 1.2) {
                    segments.push({ start: speechStart, end: time, text: "" });
                }
                isSpeech = false;
            }
        }

        if (segments.length === 0) {
            const duration = audioBuffer.duration;
            for (let t = 0; t < duration; t += 4) {
                segments.push({ start: t, end: Math.min(t + 3.8, duration), text: "" });
            }
        }

        return segments;
    }

    // 3. Khớp lời dán vào mốc thời gian
    btnApplyLyrics.addEventListener('click', () => {
        const text = rawLyricsInput.value.trim();
        if (!text) return;

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        parsedSubtitles.forEach((sub, idx) => {
            if (idx < lines.length) {
                sub.text = lines[idx];
            } else if (!sub.text) {
                sub.text = `[Lời nhạc ${idx + 1}]`;
            }
        });

        renderSubtitles();
        statusDisplay.innerText = "🎉 Đã khớp lời bài hát thành công!";
    });

    // 4. Hiển thị & Cho phép chỉnh sửa chữ trực tiếp
    function renderSubtitles() {
        lyricsContainer.innerHTML = '';
        parsedSubtitles.forEach((sub, idx) => {
            const item = document.createElement('div');
            item.className = 'lyric-item';
            item.id = `sub-item-${idx}`;

            const timeLabel = document.createElement('div');
            timeLabel.className = 'lyric-time';
            timeLabel.innerText = `${formatSrtTime(sub.start)} --> ${formatSrtTime(sub.end)}`;

            const input = document.createElement('input');
            input.className = 'lyric-input';
            input.value = sub.text || `[Lời nhạc ${idx + 1}]`;
            input.addEventListener('input', (e) => {
                parsedSubtitles[idx].text = e.target.value;
            });

            item.appendChild(timeLabel);
            item.appendChild(input);
            lyricsContainer.appendChild(item);
        });
    }

    // 5. Đồng bộ cuộn lời khi phát nhạc
    audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        let activeIdx = -1;

        for (let i = 0; i < parsedSubtitles.length; i++) {
            if (currentTime >= parsedSubtitles[i].start && currentTime <= parsedSubtitles[i].end) {
                activeIdx = i;
                break;
            }
        }

        document.querySelectorAll('.lyric-item').forEach((el, idx) => {
            if (idx === activeIdx) {
                if (!el.classList.contains('active')) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                el.classList.remove('active');
            }
        });
    });

    // 6. Xuất File .SRT
    btnDownloadSrt.addEventListener('click', () => {
        let content = "";
        parsedSubtitles.forEach((sub, idx) => {
            content += `${idx + 1}\n${formatSrtTime(sub.start)} --> ${formatSrtTime(sub.end)}\n${sub.text || '...'}\n\n`;
        });
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `karaoke_${Date.now()}.srt`;
        a.click();
    });

    function formatSrtTime(seconds) {
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        const ms = Math.floor((seconds - Math.floor(seconds)) * 1000).toString().padStart(3, '0');
        return `${h}:${m}:${s},${ms}`;
    }

    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    audioPlayer.addEventListener('play', () => {
        if (!isAudioCtxInit) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source = audioCtx.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioCtxInit = true;
        }
        drawVisualizer();
    });

    function drawVisualizer() {
        if (!analyser || audioPlayer.paused) return;
        requestAnimationFrame(drawVisualizer);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#0d1117';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / dataArray.length) * 1.5;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            let barHeight = (dataArray[i] / 255) * canvas.height;
            canvasCtx.fillStyle = `rgb(88, ${Math.min(255, barHeight + 100)}, 255)`;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
            x += barWidth + 1;
        }
    }
</script>
</body>
</html>
