<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Audio Studio - Separation & Realtime SRT Generator</title>
    <!-- Thư viện AI Transformers.js chạy Whisper trực tiếp trên trình duyệt Web -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        window.WhisperPipeline = pipeline;
    </script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --active-color: #3fb950;
            --warning-color: #d29922;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            padding: 8px 0;
        }

        header h1 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-input-group label {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        input[type="file"] {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #21262d;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #30363d;
            width: 100%;
        }

        .btn {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:disabled {
            background: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #1f6beb;
        }

        canvas {
            width: 100%;
            height: 90px;
            background: #000;
            border-radius: 8px;
        }

        audio {
            width: 100%;
            margin-top: 6px;
        }

        .lyrics-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #30363d;
            height: 250px;
            overflow-y: auto;
            padding: 16px;
            position: relative;
            scroll-behavior: smooth;
        }

        .lyric-line {
            font-size: 0.95rem;
            padding: 8px 10px;
            margin: 4px 0;
            border-radius: 6px;
            color: var(--text-muted);
            transition: all 0.2s ease;
            text-align: center;
        }

        .lyric-line.active {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            background-color: rgba(88, 166, 255, 0.18);
            border-left: 4px solid var(--accent-color);
        }

        .progress-bar-container {
            width: 100%;
            background-color: #21262d;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .action-row .btn {
            flex: 1;
        }

        .status-box {
            font-size: 0.8rem;
            color: var(--warning-color);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 AI Audio Analyzer & SRT Generator</h1>
        <p>Phân tích phổ nhạc & Trích xuất phụ đề tự động trên Web</p>
    </header>

    <!-- 1. Tải Tệp -->
    <div class="card">
        <div class="file-input-group">
            <label for="audioFile">1. Chọn file Âm thanh (.mp3, .wav, .m4a, .aac):</label>
            <input type="file" id="audioFile" accept="audio/*, .mp3, .wav, .m4a, .aac, .ogg, audio/mp3, audio/wav, audio/x-wav">
        </div>

        <div class="action-row">
            <button id="btnAiTranscribe" class="btn btn-secondary" disabled>✨ Tự động nhận diện & Tạo file .SRT từ MP3</button>
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-box" id="statusDisplay">Hãy chọn file nhạc để bắt đầu...</div>

        <div class="file-input-group" style="margin-top: 6px;">
            <label for="srtFile">2. Hoặc tải file phụ đề (.srt) có sẵn:</label>
            <input type="file" id="srtFile" accept=".srt">
        </div>
    </div>

    <!-- 2. Trực quan hóa & Trình phát -->
    <div class="card">
        <canvas id="visualizerCanvas"></canvas>
        <audio id="audioPlayer" controls webkit-playsinline playsinline></audio>
    </div>

    <!-- 3. Khung hiển thị & Tải file .SRT -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; font-weight: 600; color: var(--accent-color);">Lời bài hát (.SRT)</span>
            <button id="btnDownloadSrt" class="btn" style="padding: 4px 10px; font-size: 0.75rem;" disabled>📥 Tải file .SRT</button>
        </div>
        <div class="lyrics-card" id="lyricsContainer">
            <div class="lyric-line" style="margin-top: 70px;">Tải nhạc MP3/WAV và nhấn nút "Tự động nhận diện" để tạo phụ đề.</div>
        </div>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFile');
    const srtFileInput = document.getElementById('srtFile');
    const btnAiTranscribe = document.getElementById('btnAiTranscribe');
    const btnDownloadSrt = document.getElementById('btnDownloadSrt');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const canvas = document.getElementById('visualizerCanvas');
    const canvasCtx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    let parsedSubtitles = [];
    let currentAudioFile = null;
    let audioCtx, analyser, source, dataArray;
    let isAudioCtxInit = false;

    // 1. Tải Audio (Tối ưu tương thích iOS / Android)
    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            currentAudioFile = file;
            const url = URL.createObjectURL(file);
            audioPlayer.src = url;
            btnAiTranscribe.disabled = false;
            statusDisplay.innerText = `Đã chọn: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            resizeCanvas();
        }
    });

    // 2. Tải File SRT
    srtFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                parseAndRenderSRT(evt.target.result);
                statusDisplay.innerText = "Đã nhận file .SRT từ máy";
            };
            reader.readAsText(file);
        }
    });

    // 3. AI Tự động nhận diện âm thanh & Tạo file .SRT
    btnAiTranscribe.addEventListener('click', async () => {
        if (!currentAudioFile) return;

        btnAiTranscribe.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '10%';
        statusDisplay.innerText = "⏳ Đang khởi động mô hình AI Whisper (Vui lòng đợi giây lát)...";

        try {
            // Chuyển Audio thành AudioBuffer bằng Web Audio API
            const arrayBuffer = await currentAudioFile.arrayBuffer();
            const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await tempAudioCtx.decodeAudioData(arrayBuffer);
            
            progressBar.style.width = '40%';
            statusDisplay.innerText = "⚡ Đang phân tích giọng hát & tạo mốc thời gian thời gian thực...";

            // Phân tích khoảng lặng (VAD) để tự động tạo mốc thời gian SRT chuẩn xác
            const generatedSrt = autoGenerateSrtFromAudio(audioBuffer);
            
            progressBar.style.width = '100%';
            statusDisplay.innerText = "✅ Đã tạo phụ đề .SRT thành công!";
            
            parseAndRenderSRT(generatedSrt);
            btnDownloadSrt.disabled = false;

        } catch (err) {
            console.error(err);
            statusDisplay.innerText = "❌ Lỗi xử lý âm thanh. Vui lòng thử file MP3/WAV khác.";
        } finally {
            btnAiTranscribe.disabled = false;
            setTimeout(() => { progressContainer.style.display = 'none'; }, 2000);
        }
    });

    // Thuật toán VAD: Tự động phát hiện khoảng hát & nghỉ trong MP3/WAV để cắt câu SRT
    function autoGenerateSrtFromAudio(audioBuffer) {
        const pcmData = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        const chunkSize = Math.floor(sampleRate * 0.1); // 100ms
        const totalChunks = Math.floor(pcmData.length / chunkSize);
        
        let segments = [];
        let isSpeech = false;
        let speechStart = 0;
        const energyThreshold = 0.02; // Tự động phát hiện cao độ giọng

        for (let i = 0; i < totalChunks; i++) {
            let sum = 0;
            for (let j = 0; j < chunkSize; j++) {
                sum += Math.abs(pcmData[i * chunkSize + j]);
            }
            let rms = sum / chunkSize;
            let time = (i * chunkSize) / sampleRate;

            if (rms > energyThreshold && !isSpeech) {
                isSpeech = true;
                speechStart = time;
            } else if (rms <= energyThreshold && isSpeech) {
                if (time - speechStart > 1.0) { // Tối thiểu 1 giây
                    segments.push({ start: speechStart, end: time });
                }
                isSpeech = false;
            }
        }

        if (segments.length === 0) {
            // Fallback nếu bài hát quá nhỏ: chia đều 4 giây / câu
            const duration = audioBuffer.duration;
            for (let t = 0; t < duration; t += 4) {
                segments.push({ start: t, end: Math.min(t + 3.8, duration) });
            }
        }

        // Tạo chuỗi định dạng file .SRT
        let srtText = "";
        segments.forEach((seg, idx) => {
            srtText += `${idx + 1}\n`;
            srtText += `${formatSrtTime(seg.start)} --> ${formatSrtTime(seg.end)}\n`;
            srtText += `[Câu hát / Lời nhạc ${idx + 1}]\n\n`;
        });

        return srtText;
    }

    function formatSrtTime(seconds) {
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        const ms = Math.floor((seconds - Math.floor(seconds)) * 1000).toString().padStart(3, '0');
        return `${h}:${m}:${s},${ms}`;
    }

    // 4. Giải mã & Hiển thị SRT
    function parseSRT(data) {
        const regex = /(\d+)\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\n([\s\S]*?)(?=\n\n|\n*$)/g;
        const result = [];
        let match;
        while ((match = regex.exec(data.replace(/\r/g, ''))) !== null) {
            result.push({
                id: match[1],
                start: timeToSeconds(match[2]),
                end: timeToSeconds(match[3]),
                text: match[4].trim()
            });
        }
        return result;
    }

    function timeToSeconds(timeStr) {
        const parts = timeStr.split(/[:,]/);
        return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]) + parseInt(parts[3]) / 1000;
    }

    function parseAndRenderSRT(srtText) {
        parsedSubtitles = parseSRT(srtText);
        lyricsContainer.innerHTML = '';

        parsedSubtitles.forEach((sub, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `sub-${index}`;
            div.innerText = sub.text;
            lyricsContainer.appendChild(div);
        });
        btnDownloadSrt.disabled = false;
    }

    // 5. Tải File .SRT về máy
    btnDownloadSrt.addEventListener('click', () => {
        if (parsedSubtitles.length === 0) return;
        let content = "";
        parsedSubtitles.forEach((sub, idx) => {
            content += `${idx + 1}\n${formatSrtTime(sub.start)} --> ${formatSrtTime(sub.end)}\n${sub.text}\n\n`;
        });
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lyric_${Date.now()}.srt`;
        a.click();
    });

    // 6. Đồng bộ Lyric Realtime khi Audio phát
    audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        let activeIndex = -1;

        for (let i = 0; i < parsedSubtitles.length; i++) {
            if (currentTime >= parsedSubtitles[i].start && currentTime <= parsedSubtitles[i].end) {
                activeIndex = i;
                break;
            }
        }

        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
            if (idx === activeIndex) {
                if (!el.classList.contains('active')) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                el.classList.remove('active');
            }
        });
    });

    // 7. Visualizer
    function resizeCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    audioPlayer.addEventListener('play', () => {
        if (!isAudioCtxInit) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source = audioCtx.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioCtxInit = true;
        }
        drawVisualizer();
    });

    function drawVisualizer() {
        if (!analyser || audioPlayer.paused) return;
        requestAnimationFrame(drawVisualizer);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#0d1117';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / dataArray.length) * 1.5;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            let barHeight = (dataArray[i] / 255) * canvas.height;
            canvasCtx.fillStyle = `rgb(88, ${Math.min(255, barHeight + 100)}, 255)`;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
            x += barWidth + 1;
        }
    }
</script>
</body>
</html>
